<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Ghostly Message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- Cute little white ghost -->
    <svg class="ghost" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-label="A cute white ghost">
      <path d="M60 8 C28 8 12 32 12 62 L12 120 C12 128 18 130 23 125 L33 115 L45 127 C50 132 54 132 59 127 L70 115 L82 127 C87 132 91 132 96 127 L103 120 C108 115 108 112 108 108 L108 62 C108 32 92 8 60 8 Z" fill="#ffffff"/>
      <ellipse cx="44" cy="58" rx="7" ry="9" fill="#1c2b66"/>
      <ellipse cx="76" cy="58" rx="7" ry="9" fill="#1c2b66"/>
      <circle cx="46" cy="55" r="2.4" fill="#fff"/>
      <circle cx="78" cy="55" r="2.4" fill="#fff"/>
      <ellipse cx="32" cy="76" rx="8" ry="5" fill="#ffb3c7" opacity="0.8"/>
      <ellipse cx="88" cy="76" rx="8" ry="5" fill="#ffb3c7" opacity="0.8"/>
      <path d="M52 76 Q60 84 68 76" fill="none" stroke="#1c2b66" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="ghost-shadow"></div>

    <h1>It has come to my attention that you have not texted your Girlfriend since HOURS!!! WHY is that so??</h1>

    <div class="buttons">
      <button class="btn" data-button="1" data-href="busy.html">You were busy</button>
      <button class="btn" data-button="2" data-href="angry.html">You are angry at her</button>
      <div class="btn-slot">
        <button class="btn" id="runaway" type="button">You don't love her anymore</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
