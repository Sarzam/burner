<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>A Ghostly Message</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <!-- Cute little white ghost -->
    <svg class="ghost" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-label="A cute white ghost">
      <path d="M60 8 C28 8 12 32 12 62 L12 120 C12 128 18 130 23 125 L33 115 L45 127 C50 132 54 132 59 127 L70 115 L82 127 C87 132 91 132 96 127 L103 120 C108 115 108 112 108 108 L108 62 C108 32 92 8 60 8 Z" fill="#ffffff"/>
      <!-- half-lidded, unimpressed eyes -->
      <path d="M37 62 A7 7 0 0 0 51 62 Z" fill="#1c2b66"/>
      <path d="M69 62 A7 7 0 0 0 83 62 Z" fill="#1c2b66"/>
      <line x1="35" y1="62" x2="53" y2="62" stroke="#1c2b66" stroke-width="3" stroke-linecap="round"/>
      <line x1="67" y1="62" x2="85" y2="62" stroke="#1c2b66" stroke-width="3" stroke-linecap="round"/>
      <!-- angry eyebrows -->
      <line x1="31" y1="47" x2="54" y2="56" stroke="#1c2b66" stroke-width="4" stroke-linecap="round"/>
      <line x1="89" y1="47" x2="66" y2="56" stroke="#1c2b66" stroke-width="4" stroke-linecap="round"/>
      <ellipse cx="30" cy="78" rx="8" ry="5" fill="#ffb3c7" opacity="0.7"/>
      <ellipse cx="90" cy="78" rx="8" ry="5" fill="#ffb3c7" opacity="0.7"/>
      <!-- grumpy frown -->
      <path d="M49 88 Q60 78 71 88" fill="none" stroke="#1c2b66" stroke-width="3" stroke-linecap="round"/>
      <!-- little anger mark -->
      <path d="M86 22 L92 28 M92 22 L86 28" stroke="#ff5c7a" stroke-width="3" stroke-linecap="round"/>
    </svg>
    <div class="ghost-shadow"></div>

    <h1>It has come to my attention that you have not texted your Girlfriend since HOURS!!! WHY is that so??</h1>

    <div class="buttons">
      <button class="btn" data-button="1" data-href="busy.html">You were busy</button>
      <button class="btn" data-button="2" data-href="angry.html">You are angry at her</button>
      <div class="btn-slot">
        <button class="btn" id="runaway" type="button">You don't love her anymore</button>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
